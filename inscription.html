<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Inscription – Keur Royal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="conteneur">
    <a class="logo" href="index.html">Keur Royal</a>
    <nav><a href="index.html">Accueil</a></nav>
  </div></header>

  <main class="conteneur">
    <form class="formulaire" id="form-inscription" novalidate>
      <h1>Créer un compte</h1>
      <label for="nom">Nom complet</label>
      <input id="nom" name="nom" type="text" autocomplete="name" maxlength="80" required>
      <label for="telephone">Téléphone</label>
      <input id="telephone" name="telephone" type="tel" autocomplete="tel" maxlength="20" required>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="mdp">Mot de passe (8 caractères minimum, avec lettres et chiffres)</label>
      <div class="champ-mdp"><input id="mdp" name="mdp" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="oeil" data-cible="mdp" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="trait" x1="3" y1="3" x2="21" y2="21"/></svg></button></div>
      <label for="mdp2">Confirmer le mot de passe</label>
      <div class="champ-mdp"><input id="mdp2" name="mdp2" type="password" autocomplete="new-password" required><button type="button" class="oeil" data-cible="mdp2" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="trait" x1="3" y1="3" x2="21" y2="21"/></svg></button></div>
      <input class="piege" name="site" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p><button class="btn3d" type="submit">Créer mon compte</button></p>
      <p class="msg" id="msg" role="status"></p>
      <p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
