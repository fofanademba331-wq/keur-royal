<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Connexion – Keur Royal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="conteneur">
    <a class="logo" href="index.html">Keur Royal</a>
    <nav><a href="index.html#biens">Nos biens</a></nav>
  </div></header>

  <main class="conteneur">
    <form class="formulaire" id="form-connexion" novalidate>
      <h1>Connexion</h1>
      <label for="c-email">E-mail</label>
      <input id="c-email" name="email" type="email" autocomplete="username" required>
      <label for="c-mdp">Mot de passe</label>
      <div class="champ-mdp"><input id="c-mdp" name="mdp" type="password" autocomplete="current-password" required><button type="button" class="oeil" data-cible="c-mdp" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="trait" x1="3" y1="3" x2="21" y2="21"/></svg></button></div>
      <label class="case"><input type="checkbox" id="souvenir" name="souvenir"> Se souvenir de moi</label>
      <p><button class="btn3d" type="submit">Se connecter</button></p>
      <p class="msg" id="msg2" role="status"></p>
      <p>Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
